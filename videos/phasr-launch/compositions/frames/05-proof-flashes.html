  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      // slow continuous push on the ambient glow — the camera move running underneath the cuts
      tl.fromTo(
        "#pf05-ambient",
        { scale: 1, opacity: 0.7 },
        { scale: 1.12, opacity: 1, duration: 5.525, ease: "none" },
        0
      );

      function flashAt(t) {
        tl.fromTo("#pf05-flash", { opacity: 0 }, { opacity: 0.55, duration: 0.05, ease: "none" }, t);
        tl.to("#pf05-flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.05);
      }

      function snapIn(name, t) {
        var halo = "#" + name + "-halo";
        var rim = "#" + name + "-rim";

        // hard cut: the silhouette snaps to full presence almost instantly
        tl.fromTo(halo, { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.09, ease: "power4.out" }, t);
        tl.fromTo(rim, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.07, ease: "none" }, t);

        // then the pink rim-light traces the silhouette edge
        tl.fromTo(rim, { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, t + 0.07);

        // glow settles to a steady held intensity for the rest of the flash
        tl.to(halo, { opacity: 0.6, duration: 0.45, ease: "sine.out" }, t + 0.65);
      }

      flashAt(0);
      snapIn("pf05-athlete", 0);

      flashAt(1.75);
      snapIn("pf05-founder", 1.75);

      flashAt(3.5);
      snapIn("pf05-soldier", 3.5);
