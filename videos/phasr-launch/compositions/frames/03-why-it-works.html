      <div

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          // deterministic per-character split for the type-on beats — no randomness, no timers
          function splitChars(el) {
            var text = el.textContent;
            el.textContent = "";
            var spans = [];
            for (var i = 0; i < text.length; i++) {
              var ch = text[i];
              var span = document.createElement("span");
              span.className = "wiw03-char";
              span.textContent = ch === " " ? " " : ch;
              el.appendChild(span);
              spans.push(span);
            }
            return spans;
          }

          var line1Chars = splitChars(document.getElementById("wiw03-line1"));
          var line2Chars = splitChars(document.getElementById("wiw03-line2"));
          var label2 = document.getElementById("wiw03-label2");
          var topBlock = document.getElementById("wiw03-top-block");
          var thesisLines = document.getElementById("wiw03-thesis-lines");
          var captionLine = document.getElementById("wiw03-caption-line");

          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          // Scene 1 — "Not a rule." types on (beat 1)
          tl.fromTo(
            line1Chars,
            { opacity: 0, x: -6 },
            { opacity: 1, x: 0, duration: 0.16, stagger: 0.032, ease: "power1.out" },
            0.15
          );

          // Scene 1 — "An identity to protect." types on (beat 2)
          tl.fromTo(
            line2Chars,
            { opacity: 0, x: -6 },
            { opacity: 1, x: 0, duration: 0.16, stagger: 0.026, ease: "power1.out" },
            1.3
          );

          // Scene 2 — the label fades up beneath, on its VO cue
          tl.fromTo(
            label2,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
            3.0
          );

          // Seam: inverse zoom-through — the setup recedes away from the viewer as the
          // thesis arrives oversized and retracts into place (arrival/payoff beat).
          // Phase 1 — exit: outgoing recedes (scale + blur share power3.in; opacity is a
          // separate linear tween so the dimming reads even).
          tl.to(
            topBlock,
            { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in" },
            5.8
          );
          tl.to(topBlock, { opacity: 0.15, duration: 0.2, ease: "none" }, 5.8);

          // Phase 2 — hard cut at peak blur/velocity: outgoing vanishes, incoming lands
          // oversized mid-recede (same values on both sides of the cut) with its −4°
          // brand tilt set once, for good.
          tl.set(topBlock, { opacity: 0 }, 6.0);
          tl.set(
            thesisLines,
            { rotation: -4, scale: 1.25, opacity: 0.15, filter: "blur(10px)" },
            6.0
          );

          // Phase 3 — entry: the thesis retracts into the focal plane. Rotation is left
          // untouched here so the −4° brand tilt persists through the hold.
          tl.to(
            thesisLines,
            { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
            6.0
          );
          // thesisLines receives no further tweens after 6.5s — it holds fully still
          // through the rest of the frame, per the held-climax direction.

          // Scene 4 — the quiet caption line arrives late, beneath the still thesis
          tl.fromTo(
            captionLine,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
            10.0
          );

          window.__timelines["03-why-it-works"] = tl;
        })();
      </script>
